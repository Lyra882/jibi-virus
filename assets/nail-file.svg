<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 220" width="60" height="220">
  <defs>
    <!-- 主粉色 -->
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC0D0"/>
      <stop offset=".5" stop-color="#F8B4C8"/>
      <stop offset="1" stop-color="#E89BB4"/>
    </linearGradient>
    <!-- 砂条纹理（深色斜线） -->
    <pattern id="grit" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#F8B4C8"/>
      <line x1="0" y1="1.5" x2="3" y2="1.5" stroke="#D88AA6" stroke-width=".6"/>
      <line x1="0" y1="0" x2="3" y2="3" stroke="#E89BB4" stroke-width=".4" opacity=".4"/>
    </pattern>
  </defs>
  <!-- 描边 -->
  <rect x="6" y="6" width="48" height="208" rx="22" fill="url(#g1)" stroke="#C97394" stroke-width="2.5"/>
  <!-- 中间砂条区 -->
  <rect x="14" y="20" width="32" height="170" rx="14" fill="url(#grit)" stroke="#C97394" stroke-width="1"/>
  <!-- 顶部圆头高光 -->
  <ellipse cx="22" cy="22" rx="5" ry="3" fill="rgba(255,255,255,.6)"/>
  <!-- 底部 logo/装饰 -->
  <circle cx="30" cy="200" r="3" fill="#FF7A9E" stroke="#A04060" stroke-width=".6"/>
</svg>
